name: CI

# There is deliberately no `paths:` filter here, and there must not be one.
#
# The jobs below are required status checks. GitHub leaves a required check in a
# permanent "Pending" state when its workflow is skipped by path filtering, which
# blocks the pull request from ever merging. A documentation-only pull request,
# including the ones that tick a ROADMAP box, would be stuck. A job skipped by an
# `if:` condition reports success; a workflow skipped by a path filter does not.
# See docs.github.com, "Troubleshooting required status checks".
#
# The cost is that a documentation-only pull request runs the full matrix for
# about a minute. That is the price of branch protection that actually works,
# and it is cheap.
#
# codeql.yml keeps its filter on purpose: it is not a required check, so it is
# free to stay quiet on documentation changes.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept, and now load-bearing in a second way. Without the paths filter this
  # workflow runs on every pull request, including ones based on a commit from
  # before go.mod existed, where setup-go fails outright on a missing
  # go-version-file. The guard makes the Go jobs skip instead, and a job skipped
  # by an `if:` reports success, so a required check is still satisfied.
  # Mirrors the same job in codeql.yml.
  guard:
    name: check for Go source
    runs-on: ubuntu-latest
    outputs:
      has_go: ${{ steps.check.outputs.has_go }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          if [ -n "$(find . -path ./.git -prune -o -name '*.go' -print -quit)" ]; then
            echo "has_go=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go=false" >> "$GITHUB_OUTPUT"
            echo "No Go source here, skipping build and test."
          fi

  test:
    name: test (${{ matrix.os }})
    needs: guard
    if: needs.guard.outputs.has_go == 'true'
    runs-on: ${{ matrix.os }}
    # A stuck job otherwise runs until the six-hour default, which wastes a
    # runner and tells nobody anything. Building Fyne under cgo with a cold
    # cache is the slow part here, and on Windows it is several minutes, so
    # this is set well above the honest worst case rather than close to it.
    timeout-minutes: 30
    strategy:
      # Never cancel the other platform on one failure. Knowing a change breaks
      # Windows but not Linux is most of the diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Fyne needs X11, Wayland, and OpenGL headers to build on Linux. Build
      # time only; the shipped binary needs nothing, which is the whole point
      # of adr/0005. The Wayland pair is not optional: glfw compiles its
      # wl_platform backend regardless of which display server will be used,
      # so leaving them out fails on a missing wayland-client-core.h. This list
      # mirrors what Fyne's own CI installs.
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libx11-dev \
                                  libwayland-dev libxkbcommon-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Compiling the test binaries is separated from running them so the two
      # can be told apart in the step timings. Under cgo with a cold cache the
      # build dominates, and without this split a slow compile and a hung test
      # look identical from the outside.
      - name: Build tests
        run: go test -race -run "^$" ./...

      - name: Test
        # -timeout is below Go's 10-minute default on purpose. These tests take
        # seconds; anything approaching a minute is a deadlock, and the timeout
        # turns it into a goroutine dump naming the offender instead of a job
        # that sits there.
        run: go test -race -timeout 2m ./...

  lint:
    name: lint
    needs: guard
    if: needs.guard.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libx11-dev \
                                  libwayland-dev libxkbcommon-dev

      # Enforces the godoc rule from adr/0007 via revive's `exported` rule,
      # configured in .golangci.yml.
      #
      # This action from v7 onward supports golangci-lint v2 ONLY, and v8+
      # requires >= 2.1.0. So .golangci.yml must use the v2 schema, which is not
      # compatible with v1 and is not what most examples online still show.
      # The action validates the config against its JSONSchema by default, so a
      # v1 file fails loudly here rather than silently linting nothing.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
